<style>
:root{--bg:#000;--fg:#f4f4f4;--mute:#8a8a8a;--card:#141414;--line:#222;--y:#fff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh}
main{width:100%;max-width:480px;padding:20px 16px 24px;flex:1 0 auto}h1{font-size:24px;margin:0 0 4px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.hoy{flex:none;border:1px solid var(--line);background:none;border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer;margin-top:2px}
.lg{display:block;width:100%;max-width:480px;height:auto;flex:none;margin:0;padding-bottom:env(safe-area-inset-bottom,0)}.s{color:var(--mute);margin:0 0 16px;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.hd b{font-size:20px;text-transform:capitalize}
.ib{background:none;border:0;width:40px;height:40px;font-size:20px;border-radius:50%}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}#gr{grid-template-rows:repeat(6,1fr);aspect-ratio:7/6}#gr .d{aspect-ratio:auto;min-height:0}.s{min-height:42px}.w{text-align:center;color:var(--mute);font-size:12px;padding:4px 0}
.d{aspect-ratio:1;border:0;border-radius:14px;background:none;color:var(--mute);opacity:.35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.d.on{background:var(--card);color:var(--fg);opacity:1}.d.on i{width:6px;height:6px;border-radius:50%;background:var(--y)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}#ov.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 16px 28px;max-height:90%;overflow:auto;border-top:1px solid var(--line)}
.sh h2{margin:0 0 4px;font-size:20px;text-transform:capitalize}.ch{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.ch button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:10px 16px;font-weight:600}
input{width:100%;background:var(--card);border:1px solid transparent;border-radius:12px;padding:14px;margin-bottom:10px;font:inherit;color:var(--fg);outline:none}input:focus{border-color:var(--y)}
.pri{width:100%;height:52px;border:0;border-radius:26px;background:var(--y);color:#000;font-weight:700;margin-top:4px}.pri:disabled{opacity:.4}
.mn{color:var(--mute);opacity:.7;font-size:12px;margin:-10px 0 14px}.ad{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin:22px 0 4px;opacity:.9}.ad span{color:var(--mute);font-size:12px;width:100%;text-align:center}.ad a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:18px;padding:7px 12px;font-size:13px;color:var(--fg);text-decoration:none;background:none}.ad svg{flex:none}
.er{color:#ff6b6b;min-height:20px;font-size:14px}.ok{text-align:center;padding:24px 0}.lk{width:100%;background:none;border:0;color:var(--mute);margin-top:8px;font-size:15px}
</style></head><body><main>
<div class="top"><div><h1>Reservar turno</h1><p class="s" id="s">Elegí un día con horarios disponibles.</p></div><button class="hoy" id="hoy">Hoy</button></div>
