<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reservar turno</title>
<style>
:root{--bg:#000;--fg:#f4f4f4;--mute:#8a8a8a;--card:#141414;--line:#222;--y:#FFD60A;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:20px 16px 40px}h1{font-size:24px;margin:0 0 4px}.s{color:var(--mute);margin:0 0 16px;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.hd b{font-size:20px;text-transform:capitalize}
.ib{background:none;border:0;width:40px;height:40px;font-size:20px;border-radius:50%}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.w{text-align:center;color:var(--mute);font-size:12px;padding:4px 0}
.d{aspect-ratio:1;border:0;border-radius:14px;background:none;color:var(--mute);opacity:.35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.d.on{background:var(--card);color:var(--fg);opacity:1}.d.on i{width:6px;height:6px;border-radius:50%;background:var(--y)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}#ov.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 16px 28px;max-height:90%;overflow:auto;border-top:1px solid var(--line)}
.sh h2{margin:0 0 4px;font-size:20px;text-transform:capitalize}.ch{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.ch button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:10px 16px;font-weight:600}
input{width:100%;background:var(--card);border:1px solid transparent;border-radius:12px;padding:14px;margin-bottom:10px;font:inherit;color:var(--fg);outline:none}input:focus{border-color:var(--y)}
.pri{width:100%;height:52px;border:0;border-radius:26px;background:var(--y);color:#111;font-weight:700;margin-top:4px}.pri:disabled{opacity:.4}
.er{color:#ff6b6b;min-height:20px;font-size:14px}.ok{text-align:center;padding:24px 0}.lk{width:100%;background:none;border:0;color:var(--mute);margin-top:8px;font-size:15px}
</style></head><body><main>
<h1>Reservar turno</h1><p class="s" id="s">Elegí un día con horarios disponibles.</p>
<div class="hd"><button class="ib" id="pv">‹</button><b id="mt"></b><button class="ib" id="nx">›</button></div>
<div class="g" id="wk"></div><div class="g" id="gr"></div></main>
<div id="ov"><div class="sh" id="sh"></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=i=>document.getElementById(i),C=new URLSearchParams(location.search).get('c'),z=n=>String(n).padStart(2,'0');
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const sb=window.SUPABASE_URL?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const DEV=(()=>{try{let d=localStorage.getItem('dev');if(!d){d=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());localStorage.setItem('dev',d)}return d}catch(e){return ''}})();
let days={},vy,vm,sel=null,hora=null,step=null,busy=false;
const dt=k=>new Date(k+'T00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
async function load(){
  if(!sb||!C)return;const r=await sb.rpc('public_slots',{code:C});if(r.error||!r.data)return;
  if(!r.data.enabled){days={};$('s').textContent='Las reservas no están disponibles por ahora.'}else{days=r.data.days||{};$('s').textContent='Elegí un día con horarios disponibles.'}
  if(vy===undefined){const k=Object.keys(days).sort()[0],d=k?new Date(k+'T00:00'):new Date();vy=d.getFullYear();vm=d.getMonth()}
  draw();
  if($('ov').classList.contains('on')){
    if(step==='t')sheet();
    else if(step==='f'&&!busy&&!(days[sel]||[]).includes(hora)){hora=null;sheet('Ese horario se acaba de ocupar. Elegí otro.')}}}
function draw(){
  $('mt').textContent=MES[vm]+(vy!==new Date().getFullYear()?' '+vy:'');
  $('wk').innerHTML='LMMJVSD'.split('').map(c=>`<div class="w">${c}</div>`).join('');
  const off=(new Date(vy,vm,1).getDay()+6)%7,n=new Date(vy,vm+1,0).getDate();let h='';
  for(let i=0;i<off;i++)h+='<div></div>';
  for(let d=1;d<=n;d++){const k=vy+'-'+z(vm+1)+'-'+z(d),on=(days[k]||[]).length>0;h+=`<button class="d${on?' on':''}" data-k="${k}"${on?'':' disabled'}>${d}${on?'<i></i>':''}</button>`}
  $('gr').innerHTML=h}
function sheet(m){const sl=days[sel]||[];step='t';
  $('sh').innerHTML=`<h2>${dt(sel)}</h2><p class="s">Agendar sesión · elegí un horario</p>${m?`<div class="er">${m}</div>`:''}<div class="ch">${sl.length?sl.map(h=>`<button data-h="${h}">${h}</button>`).join(''):'<span class="s">Ya no quedan horarios este día.</span>'}</div>`;$('ov').classList.add('on')}
function form(){step='f';$('sh').innerHTML=`<h2>${dt(sel)}</h2><p class="s">Sesión a las ${hora}</p><input id="fn" placeholder="Nombre" autocomplete="given-name"><input id="fa" placeholder="Apellido" autocomplete="family-name"><input id="ft" placeholder="Teléfono (con característica, sin 0 ni 15)" inputmode="tel" autocomplete="tel"><label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mute);margin:0 0 10px"><input type="checkbox" id="fw" style="width:auto;margin:3px 0 0"> Quiero recibir un recordatorio de mi sesión por WhatsApp</label><div class="er" id="er"></div><button class="pri" id="go">Agendar</button><button class="lk" id="bk">‹ Cambiar horario</button>`}
const closeS=()=>{$('ov').classList.remove('on');step=null};
$('ov').onclick=e=>{if(e.target===$('ov'))closeS()};
$('gr').onclick=e=>{const b=e.target.closest('.d.on');if(b){sel=b.dataset.k;sheet()}};
$('pv').onclick=()=>{vm--;if(vm<0){vm=11;vy--}draw()};$('nx').onclick=()=>{vm++;if(vm>11){vm=0;vy++}draw()};
$('sh').onclick=async e=>{
  const h=e.target.closest('[data-h]');if(h){hora=h.dataset.h;form();return}
  if(e.target.id==='bk'){sheet();return}
  if(e.target.id==='cl'){closeS();return}
  if(e.target.id!=='go'||busy)return;
  const n=$('fn').value.trim(),a=$('fa').value.trim();if(n.length<2||a.length<2){$('er').textContent='Completá nombre y apellido.';return}
  if($('ft').value.replace(/\D/g,'').length<8){$('er').textContent='Ingresá un teléfono válido.';return}
  busy=true;$('go').disabled=true;
  const r=await sb.rpc('public_book',{code:C,p_nombre:n,p_apellido:a,p_tel:$('ft').value.trim(),p_fecha:sel,p_hora:hora,p_dev:DEV,p_wa:$('fw').checked}),d=r.data||{};busy=false;
  if(d.ok){step='ok';$('sh').innerHTML=`<div class="ok"><div style="font-size:42px">✓</div><h2>${d.estado==='pendiente'?'Solicitud enviada':'¡Turno agendado!'}</h2><p class="s">${d.estado==='pendiente'?'Tu turno queda pendiente de aprobación.':dt(sel)+' a las '+hora}</p><button class="pri" id="cl">Listo</button></div>`;load();return}
  const M={ocupado:'Ese horario se acaba de ocupar. Elegí otro.',limite:'Ya reservaste un turno con este link.',cerrado:'Las reservas no están disponibles por ahora.',tel:'Ingresá un teléfono válido.',datos:'Revisá nombre y apellido.'};
  await load();if(d.error==='ocupado'){hora=null;sheet(M.ocupado)}else{$('go').disabled=false;$('er').textContent=M[d.error]||'No se pudo agendar. Probá de nuevo.'}};
if(!sb||!C){$('s').textContent='Este link no es válido.'}else{load();setInterval(load,4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()})}
</script></body></html>
