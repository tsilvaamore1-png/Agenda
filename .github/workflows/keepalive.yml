# Evita que Supabase (plan gratis) pause el proyecto por inactividad.
name: keepalive
on:
  schedule: [{cron: '0 12 */3 * *'}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/agendas?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_KEY }}" -o /dev/null
